name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version consistency
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')

          echo "Tag version: $TAG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Version mismatch: tag=$TAG_VERSION, Cargo.toml=$CARGO_VERSION"
            exit 1
          fi

          for pkg in npm/aeph npm/aeph-darwin-arm64 npm/aeph-darwin-x64 npm/aeph-linux-x64; do
            PKG_VERSION=$(grep '"version"' "$pkg/package.json" | sed 's/.*"\([0-9.]*\)".*/\1/')
            echo "$pkg version: $PKG_VERSION"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::Version mismatch: tag=$TAG_VERSION, $pkg=$PKG_VERSION"
              echo "::error::Run: ./scripts/bump-version.sh $TAG_VERSION"
              exit 1
            fi
          done

          echo "All versions match!"

  build:
    needs: check-version
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            npm_pkg: aeph-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            npm_pkg: aeph-darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            npm_pkg: aeph-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare npm package
        run: |
          mkdir -p npm/${{ matrix.npm_pkg }}/bin
          cp target/${{ matrix.target }}/release/ae npm/${{ matrix.npm_pkg }}/bin/
          chmod +x npm/${{ matrix.npm_pkg }}/bin/ae

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.npm_pkg }}
          path: npm/${{ matrix.npm_pkg }}

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download aeph-darwin-arm64
        uses: actions/download-artifact@v4
        with:
          name: aeph-darwin-arm64
          path: npm/aeph-darwin-arm64

      - name: Download aeph-darwin-x64
        uses: actions/download-artifact@v4
        with:
          name: aeph-darwin-x64
          path: npm/aeph-darwin-x64

      - name: Download aeph-linux-x64
        uses: actions/download-artifact@v4
        with:
          name: aeph-linux-x64
          path: npm/aeph-linux-x64

      - name: Fix binary permissions
        run: |
          chmod +x npm/aeph-darwin-arm64/bin/ae
          chmod +x npm/aeph-darwin-x64/bin/ae
          chmod +x npm/aeph-linux-x64/bin/ae

      - name: Publish aeph-darwin-arm64
        run: npm publish --access public
        working-directory: npm/aeph-darwin-arm64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish aeph-darwin-x64
        run: npm publish --access public
        working-directory: npm/aeph-darwin-x64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish aeph-linux-x64
        run: npm publish --access public
        working-directory: npm/aeph-linux-x64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish aeph
        run: npm publish --access public
        working-directory: npm/aeph
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            tar -czf "../release/ae-${name}.tar.gz" -C "$dir/bin" ae
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
